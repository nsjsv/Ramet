# 生产 nginx:静态托管 vite 产物 + 同源反代 server(/api REST、/collab ws)

# 原始协议透传:生产里前面通常还有一层终止 TLS 的反向代理(带 X-Forwarded-Proto: https),
# 这里不能再用自己的 $scheme(恒为 http)覆盖它——server 靠它决定登录 cookie 的 Secure、拼预览源的协议(request-proto.ts)。
# 没有外层(本地冒烟直接访问本容器)时退回 $scheme
map $http_x_forwarded_proto $ramet_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 请求体上限取 server 侧各端点 bodyLimit 的最大值(导入 routes/import.ts 的 60MB;上传文件 files.ts 仍是 10MB,
    # 由 server 自己拦);nginx 默认 1m 会把大图 413 挡在门外,设小了导入 zip 也会在这一层被挡
    client_max_body_size 60m;

    # REST 反代(server 是 Hono 单端口 3789);不带 URI 的 proxy_pass 保持路径原样透传
    # Host 用 $http_host(带端口原样透传),不用 $host(会丢端口):server 的 CSRF 校验(csrf.ts)拿浏览器的 Origin 与 Host 比,
    # 丢了端口的话,在非 80 端口访问(如 WEB_PORT=8081 本地冒烟)所有改数据的请求都会被当成跨来源拒绝
    location /api {
        proxy_pass http://server:3789;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ramet_proto;
    }

    # Hocuspocus 协作 ws:必须带 Upgrade/Connection 头才走 101 升级
    # Host 用 $http_host:server 对升级请求同样核对浏览器握手的 Origin(见上面 /api 的说明)
    location /collab {
        proxy_pass http://server:3789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 网页终端 ws(server routes/pty-socket.ts:订阅 / 快照 / 输出 / 输入 / 改尺寸):同 /collab 必须带升级头;
    # 终端可能开很久没有输出,读超时给足(浏览器每 5 秒 ping 一次,服务端心跳也会走这条)
    location /term {
        proxy_pass http://server:3789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $ramet_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 本地 connector 的出站 ws(/connector 与 /connector/pair):与 /collab 同款升级头;
    # connector 连上后是长连接,读超时给足(它自己有指数退避重连兜底)
    location /connector {
        proxy_pass http://server:3789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ramet_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 入口页不能被浏览器长期缓存，否则发版后用户还拿着旧的 index.html 去拉旧脚本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前面有 CDN 时，下面几处静态文件靠边缘缓存挡刷流量，而缓存键通常含查询串：加个 ?x=随机数 就能绕过边缘、
    # 每次回源拉一整份（精灵图 2.9MB、主包 1.5MB）。前端引用它们从不带查询串，所以带了一律 404

    # 带 contenthash 的构建产物可以长期缓存
    location /assets/ {
        if ($args != "") {
            return 404;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Twemoji 图标（src/emoji.ts，vite 构建时从 @twemoji/svg 整包拷入）：文件名即码点、内容固定，永久缓存。
    # 缺的（Twemoji 15 没有的新 emoji）必须回 404 让前端 onerror 退回文本字符，不能落进下面的 SPA fallback
    location /twemoji/ {
        if ($args != "") {
            return 404;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # emoji 选择器的精灵图（~2.9MB，只在打开图标弹层时才加载）；升级 Twemoji 版本时换文件名
    location = /twemoji-sprite-64.png {
        if ($args != "") {
            return 404;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # connector 安装包（scripts/pack-connector.mjs，每次部署重打）。文件名固定：
    # - 浏览器 / npm 端 max-age=0，每次重新校验才拿得到新包；
    # - s-maxage 一年：前面有 CDN 时边缘一直存着，刷下载打不回源站；发版后要按网址清掉 CDN 缓存，否则一直是旧包；
    # - 带查询串一律 404（同上，防绕过边缘缓存）；
    # - 没有就 404，不能落进 SPA fallback（npm 会把 index.html 当 tgz 解）
    location /dl/ {
        if ($args != "") {
            return 404;
        }
        add_header Cache-Control "public, max-age=0, s-maxage=31536000";
        try_files $uri =404;
    }

    # 静态资源 + SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
